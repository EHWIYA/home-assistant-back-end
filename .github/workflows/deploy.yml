# =============================================================================
# iot-api 배포 workflow
#
# 트리거: main push, workflow_dispatch
# pytest: 이 workflow 에서만 (main). PR 은 ci.yml 만.
#
# 롤백: .github/DEPLOY_RUNBOOK.md
# =============================================================================

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      connect_only:
        description: Verify OIDC and NAS network access without deploying the API
        type: boolean
        default: false
      verify_current:
        description: Build and prepare the candidate, but redeploy the current production image
        type: boolean
        default: false

concurrency:
  group: iot-api-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # github.repository = Owner/repo — Docker·GHCR 는 소문자만 허용
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pytest -q

  build-and-push:
    name: GHCR build and push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name (lowercase)
        run: echo "IMAGE_NAME_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Set immutable deploy image ref
        id: image
        run: |
          echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy-nas:
    name: NAS docker compose deploy
    timeout-minutes: 20
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify OIDC identity and reject wrong audience
        env:
          TS_OIDC_CLIENT_ID: ${{ vars.TS_OIDC_CLIENT_ID }}
          TS_OIDC_AUDIENCE: ${{ vars.TS_OIDC_AUDIENCE }}
        run: python3 .github/scripts/check-tailscale-oidc.py

      - name: Tailscale connect
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:iot-ci

      - name: Verify CI network isolation
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
        run: |
          python3 - <<'PY'
          import os, socket
          host = os.environ['NAS_HOST']
          with socket.create_connection((host, 22), timeout=15) as conn:
              assert conn.recv(128).startswith(b'SSH-'), 'NAS SSH banner missing'
          try:
              conn = socket.create_connection((host, 443), timeout=4)
          except (TimeoutError, OSError):
              print('NAS TCP 22 reachable; TCP 443 denied')
          else:
              conn.close()
              raise SystemExit('CI isolation failed: unexpected TCP 443 access')
          PY

      - name: Deploy through NAS log preservation and maintenance gate
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.connect_only) }}
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
          NAS_SSH_USER: ${{ secrets.NAS_SSH_USER }}
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          NAS_SSH_HOST_KEYS: ${{ vars.NAS_SSH_HOST_KEYS }}
          TARGET_IMAGE: ${{ needs.build-and-push.outputs.image_ref }}
          VERIFY_CURRENT: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_current && 'true' || 'false' }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/iot-api-deploy-key"
          hosts_file="$RUNNER_TEMP/iot-api-known-hosts"
          trap 'rm -f -- "$key_file" "$hosts_file"' EXIT
          test -n "$NAS_SSH_KEY"
          test -n "$NAS_SSH_HOST_KEYS"
          printf '%s\n' "$NAS_SSH_KEY" > "$key_file"
          printf '%s\n' "$NAS_SSH_HOST_KEYS" > "$hosts_file"
          operation=iot-api-deploy
          if [ "$VERIFY_CURRENT" = true ]; then operation=iot-api-verify; fi
          ssh -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o HostKeyAlias=nas-iot-approved -o UserKnownHostsFile="$hosts_file" \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$NAS_SSH_USER@$NAS_HOST" "$operation $TARGET_IMAGE $GITHUB_SHA $GITHUB_RUN_ID"
